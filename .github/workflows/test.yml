---
name: Test formula

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: homebrew-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Install and test Jobman (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: amd64
            runner: macos-15-intel

    steps:
      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Register checked-out tap
        run: brew tap ryancswallace/tap "${GITHUB_WORKSPACE}"

      - name: Audit formula
        run: brew audit --strict --formula ryancswallace/tap/jobman

      - name: Install formula
        run: brew install --formula ryancswallace/tap/jobman

      - name: Test installation
        run: |
          brew test ryancswallace/tap/jobman
          "$(brew --prefix)/bin/jobman" \
            config validate \
            "$(brew --prefix)/etc/jobman/jobman.yml"
          test -x "$(brew --prefix)/bin/jobman"
          test -s "$(brew --prefix)/share/zsh/site-functions/_jobman"
          test -s "$(brew --prefix)/share/bash-completion/completions/jobman"
          test -s "$(brew --prefix)/share/man/man1/jobman.1"

      - name: Uninstall formula
        run: brew uninstall ryancswallace/tap/jobman