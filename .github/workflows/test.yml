---
name: Test formula

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: homebrew-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.formula }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            formula: jobman
          - arch: amd64
            runner: macos-15-intel
            formula: jobman
          - arch: arm64
            runner: macos-15
            formula: jobman-diagnose
          - arch: amd64
            runner: macos-15-intel
            formula: jobman-diagnose

    steps:
      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Register checked-out tap
        run: brew tap ryancswallace/tap "${GITHUB_WORKSPACE}"

      - name: Audit formula
        run: |
          brew style "ryancswallace/tap/${{ matrix.formula }}"
          brew audit --strict --online --formula "ryancswallace/tap/${{ matrix.formula }}"

      - name: Install formula
        run: brew install --formula "ryancswallace/tap/${{ matrix.formula }}"

      - name: Test installation
        env:
          FORMULA: ${{ matrix.formula }}
        run: |
          brew test "ryancswallace/tap/${FORMULA}"
          case "${FORMULA}" in
            jobman)
              "$(brew --prefix)/bin/jobman" \
                config validate \
                "$(brew --prefix)/etc/jobman/jobman.yml"
              test -x "$(brew --prefix)/bin/jobman"
              test -s "$(brew --prefix)/etc/jobman/jobman.yml"
              test -s "$(brew --prefix)/etc/bash_completion.d/jobman"
              test -s "$(brew --prefix)/share/zsh/site-functions/_jobman"
              test -s "$(brew --prefix)/share/man/man1/jobman.1"
              ;;
            jobman-diagnose)
              test -x "$(brew --prefix)/bin/jobman-diagnose"
              "$(brew --prefix)/bin/jobman" diagnose --help >/dev/null
              ;;
          esac

      - name: Uninstall formula
        run: brew uninstall "ryancswallace/tap/${{ matrix.formula }}"
